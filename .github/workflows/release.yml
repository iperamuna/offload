name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Tauri Application
        run: bun run tauri build --target ${{ matrix.settings.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Artifacts & Generate MD5/SHA256 Checksums
        id: artifacts
        run: |
          mkdir -p artifacts
          
          # Copy DMG bundle
          DMG_PATH=$(find src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ] && [ -f "$DMG_PATH" ]; then
            DMG_NAME=$(basename "$DMG_PATH")
            cp "$DMG_PATH" "artifacts/$DMG_NAME"
            
            # Generate MD5 checksum
            md5 -q "artifacts/$DMG_NAME" > "artifacts/${DMG_NAME}.md5"
            echo "MD5 ($(cat artifacts/${DMG_NAME}.md5))"
            
            # Generate SHA256 checksum (standard for Homebrew and verification)
            shasum -a 256 "artifacts/$DMG_NAME" > "artifacts/${DMG_NAME}.sha256"
            echo "SHA256 ($(cat artifacts/${DMG_NAME}.sha256))"
          fi

          # Include standalone CLI utility executable
          if [ -f "$HOME/.local/bin/offload" ]; then
            cp "$HOME/.local/bin/offload" "artifacts/offload-cli"
            chmod +x "artifacts/offload-cli"
            shasum -a 256 "artifacts/offload-cli" > "artifacts/offload-cli.sha256"
          fi

          ls -la artifacts/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

