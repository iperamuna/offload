name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with Universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Universal macOS Application (Apple Silicon + Intel)
        run: bun run tauri build --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Artifacts & Generate MD5/SHA256 Checksums
        id: artifacts
        run: |
          mkdir -p artifacts
          
          # Copy Universal or Architecture-specific DMG bundles
          for dmg in $(find src-tauri/target -name "*.dmg"); do
            DMG_NAME=$(basename "$dmg")
            cp "$dmg" "artifacts/$DMG_NAME"
            
            # Generate MD5 checksum
            md5 -q "artifacts/$DMG_NAME" > "artifacts/${DMG_NAME}.md5"
            echo "MD5 for ${DMG_NAME}: $(cat artifacts/${DMG_NAME}.md5)"
            
            # Generate SHA256 checksum (for Homebrew and verification)
            shasum -a 256 "artifacts/$DMG_NAME" > "artifacts/${DMG_NAME}.sha256"
            echo "SHA256 for ${DMG_NAME}: $(cat artifacts/${DMG_NAME}.sha256)"
          done

          ls -la artifacts/

      - name: Create or Update GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
