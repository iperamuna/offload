name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            arch: aarch64
            label: Apple_Silicon
          - target: x86_64-apple-darwin
            arch: x64
            label: Apple_Intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable (${{ matrix.settings.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.settings.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Tauri Application (${{ matrix.settings.label }})
        run: bun run tauri build --target ${{ matrix.settings.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-sign App Bundle with Stable Designated Requirement
        run: |
          for dmg in $(find src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg -name "*.dmg"); do
            echo "Processing DMG: $dmg"
            TEMP_DMG="${dmg}.temp.dmg"
            MOUNT_DIR=$(mktemp -d)

            hdiutil convert "$dmg" -format UDRW -o "$TEMP_DMG"
            hdiutil attach "$TEMP_DMG" -mountpoint "$MOUNT_DIR" -nobrowse -noverify

            for app in "$MOUNT_DIR"/*.app; do
              if [ -d "$app" ]; then
                echo "Applying stable designated requirement to: $app"
                codesign -s - -f --deep -i "com.indunilperamuna.offload" -r='designated => identifier "com.indunilperamuna.offload"' "$app"
                codesign -d -r- "$app"
              fi
            done

            hdiutil detach "$MOUNT_DIR"
            rm -rf "$MOUNT_DIR"
            hdiutil convert "$TEMP_DMG" -format UDZO -imagekey zlib-level=9 -ov -o "$dmg"
            rm -f "$TEMP_DMG"
            echo "Successfully re-signed $dmg"
          done

      - name: Prepare Artifacts & Generate Checksums
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.0"
          fi
          mkdir -p artifacts
          for dmg in $(find src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg -name "*.dmg"); do
            DMG_NAME="Offload_${VERSION}_${{ matrix.settings.label }}.dmg"
            cp "$dmg" "artifacts/$DMG_NAME"
            md5 -q "artifacts/$DMG_NAME" > "artifacts/${DMG_NAME}.md5"
            shasum -a 256 "artifacts/$DMG_NAME" > "artifacts/${DMG_NAME}.sha256"
            echo "Generated $DMG_NAME (MD5: $(cat artifacts/${DMG_NAME}.md5))"
          done
          ls -la artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.settings.label }}
          path: artifacts/*

  publish-release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List Artifacts
        run: ls -la release-artifacts/

      - name: Resolve Release Notes File
        id: release_notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.1.1"
          fi
          if [ -f "Docs/release-notes/RELEASE_NOTES_v${VERSION}.md" ]; then
            echo "path=Docs/release-notes/RELEASE_NOTES_v${VERSION}.md" >> $GITHUB_OUTPUT
          elif [ -f "RELEASE_NOTES_v${VERSION}.md" ]; then
            echo "path=RELEASE_NOTES_v${VERSION}.md" >> $GITHUB_OUTPUT
          elif [ -f "RELEASE_NOTES.md" ]; then
            echo "path=RELEASE_NOTES.md" >> $GITHUB_OUTPUT
          else
            echo "path=Docs/release-notes/RELEASE_NOTES_v1.0.0.md" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          draft: true
          prerelease: false
          body_path: ${{ steps.release_notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT || '' }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.0"
          fi

          ARM_SHA=$(awk '{print $1}' release-artifacts/Offload_*_Apple_Silicon.dmg.sha256 | head -n 1)
          INTEL_SHA=$(awk '{print $1}' release-artifacts/Offload_*_Apple_Intel.dmg.sha256 | head -n 1)

          echo "Target Version:    ${VERSION}"
          echo "Apple Silicon SHA: ${ARM_SHA}"
          echo "Apple Intel SHA:   ${INTEL_SHA}"

          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice ::HOMEBREW_TAP_TOKEN secret is not set. Skipping automated Homebrew Tap update."
            exit 0
          fi

          echo "Cloning iperamuna/homebrew-tap..."
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/iperamuna/homebrew-tap.git" tap-repo
          cd tap-repo

          python3 -c "
          import re, os

          v = '$VERSION'
          arm = '$ARM_SHA'
          intel = '$INTEL_SHA'

          with open('Casks/offload.rb', 'r') as f:
              content = f.read()

          content = re.sub(r'version\s+\"[^\"]*\"', f'version \"{v}\"', content)
          content = re.sub(r'sha256\s+arm:\s+\"[^\"]*\",\s*\n\s*intel:\s+\"[^\"]*\"', f'sha256 arm:   \"{arm}\",\n         intel: \"{intel}\"', content)

          with open('Casks/offload.rb', 'w') as f:
              f.write(content)
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/offload.rb

          if git diff --staged --quiet; then
            echo "Casks/offload.rb is already up to date."
          else
            git commit -m "chore(cask): update offload to v${VERSION}"
            git push origin main
            echo "Successfully updated Homebrew tap for Offload v${VERSION}!"
          fi
