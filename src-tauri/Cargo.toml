[package]
name = "offload-app"
version = "1.2.0"
description = "Offload - macOS Smart Storage Relocator"
authors = ["Indunil Peramuna <iperamuna@gmail.com>"]
license = "MIT"
repository = "https://github.com/iperamuna/offload"
edition = "2021"

[lib]
name = "offload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

