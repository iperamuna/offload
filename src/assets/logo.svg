<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Disk Gradient -->
    <linearGradient id="diskGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Core Ring Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Arrow Pulse Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="108" stroke="rgba(255,255,255,0.15)" stroke-width="3" />

  <!-- Orbit Rings -->
  <circle cx="256" cy="256" r="150" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" stroke-dasharray="12 16" />
  <circle cx="256" cy="256" r="185" stroke="rgba(124, 58, 237, 0.25)" stroke-width="2" stroke-dasharray="8 20" />

  <!-- Outer Stylized Storage Disk / Data Disc -->
  <g filter="url(#neonGlow)">
    <!-- Base Plate -->
    <rect x="146" y="136" width="220" height="240" rx="40" fill="url(#diskGrad)" opacity="0.9" />
    <rect x="146" y="136" width="220" height="240" rx="40" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    
    <!-- Central Port Ring -->
    <circle cx="256" cy="226" r="48" fill="#090d16" stroke="url(#coreGrad)" stroke-width="6" />
    <circle cx="256" cy="226" r="22" fill="url(#arrowGrad)" />

    <!-- Pulse Bars / Data Slots -->
    <rect x="180" y="316" width="28" height="12" rx="4" fill="#38bdf8" />
    <rect x="222" y="316" width="28" height="12" rx="4" fill="#60a5fa" />
    <rect x="264" y="316" width="28" height="12" rx="4" fill="#a78bfa" />
    <rect x="306" y="316" width="28" height="12" rx="4" fill="#c084fc" />
  </g>

  <!-- Dynamic Ejection / Offload Kinetic Arrow -->
  <g filter="url(#neonGlow)">
    <path d="M256 100 L300 156 L272 156 L272 200 L240 200 L240 156 L212 156 Z" fill="url(#arrowGrad)" />
  </g>

  <!-- Dual Satellite Nodes (Representing Internal & External Disc) -->
  <circle cx="120" cy="380" r="16" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="392" cy="132" r="22" fill="#a855f7" filter="url(#neonGlow)" />
  <path d="M120 380 Q 256 460 392 132" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3" stroke-dasharray="6 8" fill="none" />
</svg>

